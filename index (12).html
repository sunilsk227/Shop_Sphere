<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopSphere — Discover. Shop. Enjoy.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
/* ===== 1. DESIGN TOKENS (light + dark) ===== */
:root{--bg:#f5f6f7;--surface:#fff;--ink:#16202a;--muted:#667380;--line:#e3e7ea;--accent:#0e7c66;--accent-ink:#fff;--warn:#b45309;--danger:#c0392b;--r:14px;--shadow:0 2px 10px rgba(22,32,42,.06)}
:root[data-theme=dark]{--bg:#0f1519;--surface:#182026;--ink:#eef2f4;--muted:#93a0aa;--line:#2a343c;--accent:#3ac1a3;--accent-ink:#06211a;--warn:#f0a35a;--danger:#ff7b6b;--shadow:none}
*{box-sizing:border-box;margin:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px;width:100%}
main{flex:1;padding:28px 0 56px}
h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.1;letter-spacing:-.02em;font-weight:800}
h2{font-size:1.5rem;letter-spacing:-.01em;margin-bottom:16px}
.muted{color:var(--muted)}.small{font-size:.85rem}
/* ===== 2. BUTTONS & FORMS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;transition:.15s}
.btn:hover{border-color:var(--accent)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}.btn.block{width:100%}
.icon-btn{position:relative;background:none;border:0;padding:8px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{background:var(--bg)}
.badge{position:absolute;top:0;right:0;background:var(--accent);color:var(--accent-ink);font-size:.7rem;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-weight:700;font-size:.9rem}
.field input,.field select,.field textarea{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.field .err{color:var(--danger);font-size:.8rem;min-height:1em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
/* ===== 3. HEADER ===== */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.logo{font-weight:800;font-size:1.3rem;display:flex;align-items:center;gap:8px;letter-spacing:-.02em}
.logo i{color:var(--accent)}
.search{flex:1;max-width:460px;position:relative}
.search input{width:100%;padding:10px 14px 10px 40px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;color:var(--muted)}
nav.links{display:flex;gap:4px;margin-left:auto;align-items:center}
nav.links a{padding:8px 12px;border-radius:10px;font-weight:700;font-size:.92rem;color:var(--muted)}
nav.links a:hover,nav.links a.on{color:var(--ink);background:var(--bg)}
#menuBtn{display:none}
@media(max-width:820px){
 #menuBtn{display:grid}
 nav.links{position:absolute;top:64px;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;padding:10px 20px;display:none}
 nav.links.open{display:flex}
 .search{order:5;max-width:none}
 .bar{flex-wrap:wrap;height:auto;padding:10px 0}
 nav.links{top:auto;position:static;width:100%;margin:0}
 .row2{grid-template-columns:1fr}
}
/* ===== 4. HOME / HERO ===== */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding:24px 0 36px}
.hero p{margin:14px 0 22px;font-size:1.1rem;max-width:44ch}
.hero img{border-radius:22px;aspect-ratio:4/3;object-fit:cover;width:100%}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:36px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:700;transition:.15s}
.cat:hover{border-color:var(--accent);transform:translateY(-2px)}.cat i{color:var(--accent)}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
/* ===== 5. PRODUCTS ===== */
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.88rem}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tools select{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.pcard:hover{box-shadow:0 8px 24px rgba(22,32,42,.12);transform:translateY(-3px)}
.pcard img{aspect-ratio:4/3;object-fit:cover;width:100%;background:var(--bg);cursor:pointer}
.pbody{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pbody h3{font-size:1rem;cursor:pointer}
.price{font-weight:800;font-size:1.15rem}
.stock{font-size:.8rem;font-weight:700}.stock.in{color:var(--accent)}.stock.low{color:var(--warn)}.stock.out{color:var(--danger)}
.pact{display:flex;gap:8px;margin-top:auto;padding-top:8px}.pact .btn{flex:1;padding:9px 8px;font-size:.88rem}
.tag{font-size:.75rem;color:var(--muted);font-weight:700}
.notice{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:.88rem}
/* ===== 6. DETAIL / CART / ORDERS ===== */
.detail{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-bottom:36px}
.detail img{border-radius:var(--r);width:100%;aspect-ratio:1;object-fit:cover}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{background:var(--surface);border:0;width:34px;height:36px;cursor:pointer;font-size:1.1rem}
.qty span{min-width:36px;text-align:center;font-weight:700}
.layout2{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
.crow{display:grid;grid-template-columns:84px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.crow:last-child{border:0}.crow img{border-radius:10px;aspect-ratio:1;object-fit:cover;width:84px}
.sum{display:flex;justify-content:space-between;padding:6px 0}.sum.total{font-weight:800;font-size:1.2rem;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.status{font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.status.Delivered,.status.Confirmed{color:var(--accent)}.status.Cancelled{color:var(--danger)}.status.Shipped{color:var(--warn)}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}.empty i{width:44px;height:44px;margin:0 auto 10px;display:block}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:50px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.narrow{max-width:460px;margin:20px auto}
@media(max-width:820px){.detail,.layout2{grid-template-columns:1fr}}
/* ===== 7. TOASTS & FOOTER ===== */
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:700;font-size:.9rem;animation:in .25s}
.toast.error{background:var(--danger);color:#fff}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
footer{border-top:1px solid var(--line);background:var(--surface);padding:22px 0;color:var(--muted);font-size:.88rem}
/* ===== 8. PHONE LAYOUT ===== */
@media(max-width:820px){.logo{margin-right:auto}.hero img{order:-1}}
@media(max-width:560px){
 .wrap{padding:0 14px}main{padding-top:18px}
 .grid{grid-template-columns:repeat(2,1fr);gap:12px}
 .pbody{padding:10px}.pact{flex-direction:column}.price{font-size:1rem}
 .tools{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}.chip{white-space:nowrap}
 .tools select{margin-left:0;min-width:150px}
 .crow{grid-template-columns:64px 1fr}.crow img{width:64px}.crow>div:last-child{grid-column:1/-1;text-align:left}
 .cats{grid-template-columns:repeat(2,1fr)}
 .card{padding:16px}.detail{gap:18px}
 #toasts{left:12px;right:12px;bottom:12px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
 <div class="wrap bar">
  <a href="#/" class="logo"><i data-lucide="globe"></i>ShopSphere</a>
  <form class="search" id="searchForm" role="search"><i data-lucide="search"></i>
   <input id="searchInput" type="search" placeholder="Search products" aria-label="Search products"></form>
  <nav class="links" id="nav">
   <a href="#/" data-r="home">Home</a><a href="#/products" data-r="products">Shop</a>
   <span id="navAuth"></span>
  </nav>
  <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"><i data-lucide="moon"></i></button>
  <a class="icon-btn" href="#/cart" aria-label="Cart"><i data-lucide="shopping-cart"></i><span class="badge" id="cartCount">0</span></a>
  <button class="icon-btn" id="menuBtn" aria-label="Menu"><i data-lucide="menu"></i></button>
 </div>
</header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap">ShopSphere — Discover. Shop. Enjoy. · Internship project · Cash on Delivery only</div></footer>
<div id="toasts" aria-live="polite"></div>

<script>
/* =====================================================
   ShopSphere frontend — vanilla JS, single file.
   1. CONFIG   2. STATE   3. HELPERS   4. API   5. CART
   6. VIEWS    7. ROUTER  8. START
   ===================================================== */

/* ---------- 1. CONFIG ----------
   Same-origin (Django serves this file): leave API_BASE = "".
   Separate origin (e.g. opened from Live Server on :5500): set
   API_BASE = "http://127.0.0.1:8000" and enable CORS + credentials in Django. */
const API_BASE = "";
const CATEGORY_ICONS = {Electronics:"smartphone",Fashion:"shirt","Home and Living":"sofa",Accessories:"watch",Books:"book-open"};

/* Sample data: used ONLY when the backend is unreachable. A banner makes this obvious. */
/* Pictures are matched to each product by keyword (loremflickr.com). If a picture fails to load,
   fbImg() swaps in a built-in illustration for the product's category, so images are never broken. */
const KW = {1:"earbuds,headphones",2:"smartwatch,fitness",3:"bluetooth,speaker",4:"shirt,clothing",5:"denim,jacket",6:"table,lamp",7:"cushion,pillow",8:"leather,wallet",9:"wristwatch,watch",10:"book,reading",11:"books,programming",12:"backpack,bag"};
const img = (s,kw="shopping") => `https://loremflickr.com/640/480/${kw}?lock=${s}`;
const CAT_EMOJI = {Electronics:"🎧",Fashion:"👕","Home and Living":"🛋️",Accessories:"👜",Books:"📚"};
const PH = cat => "data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 480'><rect width='640' height='480' fill='#e8efed'/><text x='320' y='270' font-size='140' text-anchor='middle'>${CAT_EMOJI[cat]||"🛍️"}</text></svg>`);
function fbImg(el,cat){el.onerror=null;el.src=PH(cat)}
const SAMPLE = [
 [1,"Wireless Earbuds","Electronics",2499,"Noise-reducing earbuds with 24-hour battery life.",25],
 [2,"Smart Fitness Band","Electronics",1999,"Heart-rate, sleep and step tracking with a bright display.",12],
 [3,"Portable Bluetooth Speaker","Electronics",1799,"Water-resistant speaker with deep bass.",4],
 [4,"Cotton Casual Shirt","Fashion",899,"Breathable slim-fit cotton shirt for everyday wear.",40],
 [5,"Classic Denim Jacket","Fashion",2199,"Mid-weight denim jacket with a timeless cut.",8],
 [6,"Ceramic Table Lamp","Home and Living",1299,"Warm ambient lamp with a handmade ceramic base.",15],
 [7,"Linen Cushion Set","Home and Living",749,"Set of two washable linen cushion covers.",0],
 [8,"Leather Wallet","Accessories",699,"Slim genuine-leather wallet with six card slots.",30],
 [9,"Analog Wrist Watch","Accessories",3299,"Stainless-steel case with a sapphire-style glass.",6],
 [10,"Atomic Habits","Books",499,"A practical guide to building good habits.",50],
 [11,"The Pragmatic Programmer","Books",899,"Classic advice for becoming a better developer.",18],
 [12,"Canvas Backpack","Accessories",1499,"Roomy 20L backpack with a padded laptop sleeve.",22]
].map(([id,name,category,price,description,stock])=>({id,name,category,price,description,stock,image_url:img(id,KW[id])}));

/* ---------- 2. STATE ---------- */
const S = {
 products:[], categories:[], user:null, sample:false,
 cart: JSON.parse(localStorage.getItem("ss_cart")||"[]"),   // non-sensitive draft only
 q:"", cat:"All", sort:"", shown:8, lastOrder:null
};
const $ = id => document.getElementById(id);
const app = $("app");

/* ---------- 3. HELPERS ---------- */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr = n => "₹"+Number(n).toLocaleString("en-IN");
const icons = () => window.lucide && lucide.createIcons();
function toast(msg,type=""){const t=document.createElement("div");t.className="toast "+type;t.textContent=msg;$("toasts").appendChild(t);setTimeout(()=>t.remove(),3200)}
const loading = () => app.innerHTML='<div class="spin" role="status" aria-label="Loading"></div>';
const emptyState = (icon,title,text,btn="") => `<div class="empty"><i data-lucide="${icon}"></i><h2>${title}</h2><p>${text}</p>${btn}</div>`;
const stockLabel = n => n<=0?'<span class="stock out">Out of stock</span>':n<=5?`<span class="stock low">Only ${n} left</span>`:'<span class="stock in">In stock</span>';
const getCookie = n => (document.cookie.match("(^|;)\\s*"+n+"=([^;]+)")||[])[2];

/* ---------- 4. API LAYER ----------
   Every call sends the session cookie (credentials:"include") and the CSRF token
   on unsafe methods. Errors are thrown as Error(message) for the UI to show. */
async function api(path,{method="GET",body}={}){
 const opts={method,credentials:"include",headers:{"Accept":"application/json"}};
 if(method!=="GET"){
  if(!getCookie("csrftoken")) await fetch(API_BASE+"/api/csrf/",{credentials:"include"}); // sets csrftoken cookie
  opts.headers["Content-Type"]="application/json";
  opts.headers["X-CSRFToken"]=getCookie("csrftoken")||"";
  if(body) opts.body=JSON.stringify(body);
 }
 let res; try{res=await fetch(API_BASE+path,opts)}catch{throw Object.assign(new Error("Cannot reach the server. Is the Django backend running?"),{network:true})}
 const data=await res.json().catch(()=>({}));
 if(res.status===401 && S.user){S.user=null;renderAuthNav();toast("Your session expired. Please log in again.","error");location.hash="#/login"}
 if(!res.ok){
  const f=data.errors?Object.values(data.errors).flat().join(" "):"";
  throw Object.assign(new Error(data.error||data.detail||f||"Something went wrong ("+res.status+")"),{status:res.status})
 }
 return data;
}
const list = d => Array.isArray(d)?d:(d.results||[]);

async function loadCatalog(){
 try{
  S.products=list(await api("/api/products/")); S.categories=list(await api("/api/categories/")).map(c=>c.name||c); S.sample=false;
 }catch(e){
  if(!e.network) toast(e.message,"error");
  S.products=SAMPLE; S.categories=Object.keys(CATEGORY_ICONS); S.sample=true;
 }
 S.products=S.products.map(p=>{const c=p.category?.name||p.category;return {...p,category:c,price:Number(p.price),image_url:p.image_url||PH(c)}});
}
async function loadUser(){try{S.user=(await api("/api/me/")).user||null}catch{S.user=null}renderAuthNav()}
const sampleBanner = () => S.sample?'<div class="notice"><b>Sample data.</b> The backend is not connected, so these products are built-in demo items. Login and checkout need the Django API.</div>':"";

/* ---------- 5. CART ---------- */
const saveCart = () => {localStorage.setItem("ss_cart",JSON.stringify(S.cart));const n=S.cart.reduce((a,i)=>a+i.qty,0);$("cartCount").textContent=n;$("cartCount").style.display=n?"grid":"none"};
function addToCart(id,qty=1){
 const p=S.products.find(x=>x.id==id); if(!p) return;
 if(p.stock<=0) return toast("Sorry, this item is out of stock.","error");
 const it=S.cart.find(i=>i.id==id), want=(it?.qty||0)+qty;
 if(want>p.stock) return toast(`Only ${p.stock} available.`,"error");
 if(it) it.qty=want; else S.cart.push({id:p.id,name:p.name,price:p.price,image_url:p.image_url,stock:p.stock,qty});
 saveCart(); toast(`${p.name} added to cart`);
}
const cartTotal = () => S.cart.reduce((a,i)=>a+i.price*i.qty,0);
function changeQty(id,d){const it=S.cart.find(i=>i.id==id);if(!it)return;const q=it.qty+d;
 if(q<1) return removeItem(id); if(q>it.stock) return toast(`Only ${it.stock} available.`,"error");
 it.qty=q;saveCart();route()}
function removeItem(id){S.cart=S.cart.filter(i=>i.id!=id);saveCart();route()}

/* ---------- 6. VIEWS ---------- */
function productCard(p){return `<article class="pcard">
 <img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy" onclick="location.hash='#/product/${p.id}'" onerror="fbImg(this,'${esc(p.category)}')">
 <div class="pbody"><span class="tag">${esc(p.category)}</span><h3 onclick="location.hash='#/product/${p.id}'">${esc(p.name)}</h3>
 <p class="small muted">${esc(p.description).slice(0,70)}${p.description.length>70?"…":""}</p>
 <div class="price">${inr(p.price)}</div>${stockLabel(p.stock)}
 <div class="pact"><a class="btn" href="#/product/${p.id}">Details</a>
 <button class="btn primary" ${p.stock<=0?"disabled":""} onclick="addToCart(${p.id});route(true)">Add to cart</button></div></div></article>`}

function viewHome(){
 const feat=S.products.slice(0,4);
 app.innerHTML=`${sampleBanner()}<section class="hero"><div><h1>Discover. Shop. Enjoy.</h1>
 <p class="muted">Everyday electronics, fashion, home pieces, accessories and books. Pay when it arrives with Cash on Delivery.</p>
 <a class="btn primary" href="#/products"><i data-lucide="shopping-bag"></i>Start shopping</a></div>
 <img src="${img("hero","shopping,store")}" alt="Shopping bags and products" onerror="this.onerror=null;this.src=PH()"></section>
 <h2>Shop by category</h2><div class="cats">${S.categories.map(c=>`<div class="cat" onclick="S.cat='${esc(c)}';S.shown=8;location.hash='#/products'"><i data-lucide="${CATEGORY_ICONS[c]||"tag"}"></i>${esc(c)}</div>`).join("")}</div>
 <h2>Featured products</h2><div class="grid">${feat.map(productCard).join("")}</div>`;
}

function viewProducts(){
 let items=S.products.filter(p=>(S.cat==="All"||p.category===S.cat)&&p.name.toLowerCase().includes(S.q.toLowerCase()));
 const sorts={"price-asc":(a,b)=>a.price-b.price,"price-desc":(a,b)=>b.price-a.price,"name":(a,b)=>a.name.localeCompare(b.name)};
 if(sorts[S.sort]) items.sort(sorts[S.sort]);
 app.innerHTML=`${sampleBanner()}<h2>All products</h2><div class="tools">
 ${["All",...S.categories].map(c=>`<button class="chip ${S.cat===c?"on":""}" onclick="S.cat='${esc(c)}';S.shown=8;route()">${esc(c)}</button>`).join("")}
 <select id="sortSel" aria-label="Sort products"><option value="">Sort: Featured</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="name">Name: A to Z</option></select></div>
 ${S.q?`<p class="muted small" style="margin-bottom:12px">${items.length} result(s) for “${esc(S.q)}”</p>`:""}
 ${items.length?`<div class="grid">${items.slice(0,S.shown).map(productCard).join("")}</div>
 ${items.length>S.shown?'<div style="text-align:center;margin-top:22px"><button class="btn" onclick="S.shown+=8;route()">Load more</button></div>':""}`
 :emptyState("search-x","No products found","Try a different search or category.",'<button class="btn" onclick="S.q=\'\';S.cat=\'All\';$(\'searchInput\').value=\'\';route()">Clear filters</button>')}`;
 $("sortSel").value=S.sort; $("sortSel").onchange=e=>{S.sort=e.target.value;route()};
}

async function viewProduct(id){
 loading(); let p;
 try{ p=S.sample?S.products.find(x=>x.id==id):await api(`/api/products/${id}/`); if(!p) throw new Error("not found");
  p={...p,category:p.category?.name||p.category,price:Number(p.price)};
 }catch(e){return app.innerHTML=emptyState("package-x","Product not found",esc(e.status===404||e.message==="not found"?"This product does not exist or was removed.":e.message),'<a class="btn primary" href="#/products">Back to shop</a>'),icons()}
 let q=1; const related=S.products.filter(x=>x.category===p.category&&x.id!=p.id).slice(0,4);
 app.innerHTML=`${sampleBanner()}<div class="detail"><img src="${esc(p.image_url)}" alt="${esc(p.name)}" onerror="fbImg(this,'${esc(p.category)}')">
 <div><span class="tag">${esc(p.category)}</span><h1 style="font-size:2rem;margin:6px 0">${esc(p.name)}</h1><div class="price" style="font-size:1.6rem">${inr(p.price)}</div>
 <p style="margin:14px 0">${esc(p.description)}</p>${stockLabel(p.stock)}
 <div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap"><div class="qty"><button id="qm" aria-label="Decrease">−</button><span id="qv">1</span><button id="qp" aria-label="Increase">+</button></div>
 <button class="btn primary" id="addBtn" ${p.stock<=0?"disabled":""}><i data-lucide="shopping-cart"></i>Add to cart</button></div></div></div>
 ${related.length?`<h2>Related products</h2><div class="grid">${related.map(productCard).join("")}</div>`:""}`;
 $("qm").onclick=()=>{q=Math.max(1,q-1);$("qv").textContent=q};
 $("qp").onclick=()=>{q=Math.min(Math.max(p.stock,1),q+1);$("qv").textContent=q};
 $("addBtn").onclick=()=>{if(!S.products.find(x=>x.id==p.id))S.products.push(p);addToCart(p.id,q)};
}

function viewCart(){
 if(!S.cart.length) return app.innerHTML=emptyState("shopping-cart","Your cart is empty","Add something you like and it will show up here.",'<a class="btn primary" href="#/products">Continue shopping</a>');
 const n=S.cart.reduce((a,i)=>a+i.qty,0);
 app.innerHTML=`<h2>Shopping cart (${n} item${n>1?"s":""})</h2><div class="layout2"><div class="card">
 ${S.cart.map(i=>`<div class="crow"><img src="${esc(i.image_url)}" alt="${esc(i.name)}" onerror="fbImg(this)">
 <div><b>${esc(i.name)}</b><div class="muted small">${inr(i.price)} each</div>
 <div class="qty" style="margin-top:8px"><button onclick="changeQty(${i.id},-1)" aria-label="Decrease">−</button><span>${i.qty}</span><button onclick="changeQty(${i.id},1)" aria-label="Increase">+</button></div></div>
 <div style="text-align:right"><b>${inr(i.price*i.qty)}</b><br><button class="btn danger" style="margin-top:8px;padding:6px 10px" onclick="removeItem(${i.id})"><i data-lucide="trash-2"></i>Remove</button></div></div>`).join("")}</div>
 <div class="card"><h3 style="margin-bottom:10px">Order summary</h3><div class="sum"><span>Subtotal</span><span>${inr(cartTotal())}</span></div><div class="sum"><span>Delivery</span><span>Free</span></div>
 <div class="sum total"><span>Total</span><span>${inr(cartTotal())}</span></div>
 <p class="muted small" style="margin:8px 0 14px">Final prices are confirmed by the server when you place the order.</p>
 <a class="btn primary block" href="#/checkout">Proceed to checkout</a><a class="btn block" style="margin-top:8px" href="#/products">Continue shopping</a></div></div>`;
}

function authGuard(){ if(!S.user){toast("Please log in to continue.","error");location.hash="#/login";return false}return true}

function viewCheckout(){
 if(!S.cart.length){location.hash="#/cart";return}
 if(!authGuard()) return;
 app.innerHTML=`<h2>Checkout</h2><div class="layout2"><form class="card" id="coForm" novalidate>
 ${field("name","Full name","text",S.user.name||"")}${field("address","Delivery address","text")}
 <div class="row2">${field("city","City","text")}${field("state","State","text")}</div>
 <div class="row2">${field("postal","Postal code","text")}${field("phone","Phone number","tel")}</div>
 <div class="field"><label>Payment method</label><label class="card" style="padding:12px;display:flex;gap:10px"><input type="radio" checked> Cash on Delivery (pay when you receive the order)</label></div>
 <button class="btn primary block" id="placeBtn">Place order</button></form>
 <div class="card"><h3 style="margin-bottom:10px">Order summary</h3>${S.cart.map(i=>`<div class="sum"><span>${esc(i.name)} × ${i.qty}</span><span>${inr(i.price*i.qty)}</span></div>`).join("")}
 <div class="sum total"><span>Total</span><span>${inr(cartTotal())}</span></div></div></div>`;
 $("coForm").onsubmit=async e=>{
  e.preventDefault(); const v=Object.fromEntries(new FormData(e.target)); const er={};
  if(v.name.trim().length<2) er.name="Enter your full name.";
  if(v.address.trim().length<5) er.address="Enter your full address.";
  if(!v.city.trim()) er.city="Enter your city."; if(!v.state.trim()) er.state="Enter your state.";
  if(!/^\d{6}$/.test(v.postal)) er.postal="Postal code must be 6 digits.";
  if(!/^[6-9]\d{9}$/.test(v.phone)) er.phone="Enter a 10-digit mobile number.";
  showErrors(er); if(Object.keys(er).length) return;
  const btn=$("placeBtn"); btn.disabled=true; btn.textContent="Placing order…";
  try{ // Only product IDs and quantities are sent. The server decides prices and totals.
   const d=await api("/api/orders/",{method:"POST",body:{payment_method:"COD",shipping:{name:v.name,address:v.address,city:v.city,state:v.state,postal_code:v.postal,phone:v.phone},items:S.cart.map(i=>({product_id:i.id,quantity:i.qty}))}});
   S.lastOrder=d.order||d; S.cart=[]; saveCart(); await loadCatalog(); location.hash="#/confirmation/"+S.lastOrder.id;
  }catch(err){toast(err.message,"error");btn.disabled=false;btn.textContent="Place order"}
 };
}
function field(name,label,type,val=""){return `<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(val)}"><span class="err" id="e_${name}"></span></div>`}
function showErrors(er){document.querySelectorAll(".err").forEach(e=>e.textContent="");for(const k in er){const e=$("e_"+k);if(e)e.textContent=er[k]}}

function viewConfirmation(id){
 const o=S.lastOrder; if(!o||o.id!=id){location.hash="#/orders";return}
 app.innerHTML=`<div class="card narrow" style="text-align:center"><i data-lucide="circle-check" style="width:56px;height:56px;color:var(--accent);margin:0 auto"></i>
 <h2 style="margin-top:10px">Order placed!</h2><p>Your order number is</p><p style="font-size:1.4rem;font-weight:800">${esc(o.order_number)}</p>
 <p class="muted" style="margin:10px 0 18px">Total ${inr(o.total_amount)} · Pay on delivery · Status: ${esc(o.status)}</p>
 <a class="btn primary" href="#/orders">View my orders</a> <a class="btn" href="#/products">Keep shopping</a></div>`;
}

function authForm(mode){
 const reg=mode==="register";
 app.innerHTML=`<form class="card narrow" id="authForm" novalidate><h2>${reg?"Create your account":"Welcome back"}</h2>
 ${reg?field("name","Full name","text"):""}${field("email","Email","email")}${field("password","Password","password")}
 ${reg?'<p class="muted small" style="margin:-6px 0 12px">At least 8 characters, with a letter and a number.</p>':""}
 <button class="btn primary block" id="authBtn">${reg?"Create account":"Log in"}</button>
 <p class="small muted" style="margin-top:14px;text-align:center">${reg?'Already registered? <a href="#/login"><b>Log in</b></a>':'New here? <a href="#/register"><b>Create an account</b></a>'}</p></form>`;
 $("authForm").onsubmit=async e=>{
  e.preventDefault(); const v=Object.fromEntries(new FormData(e.target)); const er={};
  if(reg&&v.name.trim().length<2) er.name="Enter your name.";
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) er.email="Enter a valid email address.";
  if(reg?!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(v.password):!v.password) er.password=reg?"Use 8+ characters with a letter and a number.":"Enter your password.";
  showErrors(er); if(Object.keys(er).length) return;
  const b=$("authBtn"); b.disabled=true;
  try{ const d=await api(reg?"/api/register/":"/api/login/",{method:"POST",body:v});
   S.user=d.user; renderAuthNav(); toast(reg?"Account created. Welcome!":"Logged in."); location.hash=S.cart.length?"#/checkout":"#/";
  }catch(err){toast(err.message,"error");b.disabled=false}
 };
}

function viewProfile(){
 if(!authGuard()) return;
 app.innerHTML=`<div class="card narrow"><h2>My profile</h2><div class="sum"><span class="muted">Name</span><b>${esc(S.user.name)}</b></div>
 <div class="sum"><span class="muted">Email</span><b>${esc(S.user.email)}</b></div>
 <div style="display:flex;gap:10px;margin-top:16px"><a class="btn" href="#/orders">My orders</a><button class="btn danger" onclick="logout()">Log out</button></div></div>`;
}

async function viewOrders(){
 if(!authGuard()) return; loading();
 try{ const orders=list(await api("/api/orders/"));
  app.innerHTML=`<h2>My orders</h2>`+(orders.length?orders.map(o=>`<div class="card" style="margin-bottom:14px">
  <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><b>${esc(o.order_number)}</b><div class="muted small">${new Date(o.created_at).toLocaleString("en-IN")}</div></div><span class="status ${esc(o.status)}">${esc(o.status)}</span></div>
  ${(o.items||[]).map(i=>`<div class="sum small"><span>${esc(i.product_name||i.product?.name)} × ${i.quantity}</span><span>${inr(i.price*i.quantity)}</span></div>`).join("")}
  <div class="sum total"><span>Total (COD)</span><span>${inr(o.total_amount)}</span></div>
  ${["Pending","Confirmed"].includes(o.status)?`<button class="btn danger" onclick="cancelOrder(${o.id})">Cancel order</button>`:""}</div>`).join("")
  :emptyState("package","No orders yet","When you place an order it will appear here.",'<a class="btn primary" href="#/products">Start shopping</a>'));
 }catch(e){app.innerHTML=emptyState("triangle-alert","Could not load orders",esc(e.message),'<button class="btn" onclick="route()">Try again</button>')}
 icons();
}
async function cancelOrder(id){
 if(!confirm("Cancel this order?")) return;
 try{await api(`/api/orders/${id}/cancel/`,{method:"POST"});toast("Order cancelled.");await loadCatalog();route()}catch(e){toast(e.message,"error")}
}
async function logout(){try{await api("/api/logout/",{method:"POST"})}catch{} S.user=null;renderAuthNav();toast("Logged out.");location.hash="#/"}

function renderAuthNav(){
 $("navAuth").innerHTML=S.user?`<a href="#/orders" data-r="orders">My orders</a><a href="#/profile" data-r="profile">${esc(S.user.name.split(" ")[0])}</a>`:`<a href="#/login" data-r="login">Log in</a><a href="#/register" data-r="register">Sign up</a>`;
}

/* ---------- 7. ROUTER (hash-based, no page reloads) ---------- */
function route(keep){
 const [, page="", arg] = location.hash.slice(1).split("/");
 const y=scrollY; $("nav").classList.remove("open");
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===(page||"home")));
 const views={"":viewHome,products:viewProducts,product:()=>viewProduct(arg),cart:viewCart,checkout:viewCheckout,
  login:()=>authForm("login"),register:()=>authForm("register"),profile:viewProfile,orders:viewOrders,confirmation:()=>viewConfirmation(arg)};
 (views[page]||viewHome)(); icons(); window.scrollTo(0,keep===true?y:0);
}
window.addEventListener("hashchange",()=>route());

/* ---------- 8. START ---------- */
$("searchForm").onsubmit=e=>{e.preventDefault();S.q=$("searchInput").value.trim();S.cat="All";S.shown=8;location.hash==="#/products"?route():location.hash="#/products"};
$("menuBtn").onclick=()=>$("nav").classList.toggle("open");
$("themeBtn").onclick=()=>{const d=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=d;localStorage.setItem("ss_theme",d)};
document.documentElement.dataset.theme=localStorage.getItem("ss_theme")||"light";
(async()=>{loading();saveCart();await Promise.all([loadCatalog(),loadUser()]);route()})();
</script>
</body>
</html>
